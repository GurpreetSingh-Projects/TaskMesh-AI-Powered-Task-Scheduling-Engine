name: test
on:
  push:
    branches: [stage]
    paths:
      - "mobile/**"

  pull_request:
    branches: [stage]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - run: npm ci
      - name: Write .env
        run: echo "${{secrets.ENV_FILE}}" > .env

      - run: npm install -g eas-cli

      - name: Build on EAS
        run: eas build --profile debug --platform android --local --non-interactive --output mobile/taskmesh-debug.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Publish GitHub Release
        run: |
          gh release create "stage-${{ github.run_number }}" \
            android/app/build/outputs/apk/debug/app-debug.apk \
            --title "Stage debug build #${{ github.run_number }}" \
            --notes "Commit: ${{ github.sha }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
