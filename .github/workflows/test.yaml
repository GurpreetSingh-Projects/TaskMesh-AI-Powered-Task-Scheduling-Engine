name: Stage Mobile debug APK flow test
on:
  push:
    branches: [dev]
    paths:
      - "mobile/**"
      - ".github/workflows/test.yaml"
  pull_request:
    branches: [stage]
    paths:
      - "mobile/**"
      - ".github/workflows/test.yaml"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - run: pnpm install --frozen-lockfile

      - name: Write .env
        run: echo "${{secrets.ENV_FILE}}" > .env

      - name: Build on EAS
        run: npx eas-cli@latest build --profile debug --platform android --local --non-interactive --output taskmesh-debug.apk

        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/stage'

        run: |
          gh release create "stage-${{ github.run_number }}" \
            taskmesh-debug.apk \
            --title "Stage debug build #${{ github.run_number }}" \
            --notes "Commit: ${{ github.sha }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
