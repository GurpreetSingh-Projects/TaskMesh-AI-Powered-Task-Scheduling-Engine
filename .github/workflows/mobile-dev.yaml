name: Dev Mobile debug APK
on:
  push:
    branches: [dev]
    paths:
      - "mobile/**"
      - ".github/workflows/**"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY/CodeQL" /usr/share/swift /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium /opt/microsoft /opt/az /usr/share/miniconda
          sudo docker image prune --all --force
          df -h /

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - run: pnpm install --frozen-lockfile

      - name: Write .env
        run: echo "${{secrets.ENV_FILE}}" > .env

      - name: Extract App Details
        id: app-version
        run: |
          CONFIG=$(pnpm exec expo config --json)
          echo "name=$(echo "$CONFIG" | jq -r '.name')" >> "$GITHUB_OUTPUT"
          echo "slug=$(echo "$CONFIG" | jq -r '.slug')" >> "$GITHUB_OUTPUT"
          echo "version=$(echo "$CONFIG" | jq -r '.version')" >> "$GITHUB_OUTPUT"

      - name: Build Debug apk
        run: pnpm dlx eas-cli@latest build --profile debug --platform android --local --non-interactive --output taskmesh-dev-debug.apk

        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build Preview apk
        run: pnpm dlx eas-cli@latest build --profile preview --platform android --local --non-interactive --output taskmesh-dev-preview.apk

        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Publish GitHub Release
        run: |
          gh release create "Dev-${{ github.run_number }}" \
            taskmesh-dev-debug.apk \ 
            taskmesh-dev-preview.apk \
            --title "Dev debug and preview build #${{ github.run_number }}" \
            --notes "Commit: ${{ github.sha }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
