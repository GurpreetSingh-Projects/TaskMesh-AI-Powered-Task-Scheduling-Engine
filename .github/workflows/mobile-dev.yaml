name: Dev Mobile debug APK
on:
  push:
    branches: [dev]
    paths:
      - "mobile/**"
      - ".github/workflows/**"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY/CodeQL" /usr/share/swift /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium /opt/microsoft /opt/az /usr/share/miniconda
          sudo docker image prune --all --force
          df -h /

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - run: pnpm install --frozen-lockfile

      - name: Write .env
        run: echo "${{secrets.ENV_FILE}}" > .env

      - name: Extract App Details
        id: app-version
        run: |
          CONFIG=$(pnpm exec expo config --json)
          echo "name=$(echo "$CONFIG" | jq -r '.name')" >> "$GITHUB_OUTPUT"
          echo "slug=$(echo "$CONFIG" | jq -r '.slug')" >> "$GITHUB_OUTPUT"
          echo "version=$(echo "$CONFIG" | jq -r '.version')" >> "$GITHUB_OUTPUT"

      - name: Build Debug apk
        env:
          APP_VERSION: ${{ steps.app-version.outputs.version }}
          APP_SLUG: ${{ steps.app-version.outputs.slug }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: pnpm dlx eas-cli@latest build --profile debug --platform android --local --non-interactive --output ${APP_SLUG}-${APP_VERSION}-${{ github.ref_name }}-debug.apk

      - name: Build Preview apk
        env:
          APP_VERSION: ${{ steps.app-version.outputs.version }}
          APP_SLUG: ${{ steps.app-version.outputs.slug }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: pnpm dlx eas-cli@latest build --profile preview --platform android --local --non-interactive --output ${APP_SLUG}-${APP_VERSION}-${{ github.ref_name }}-preview.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_NAME: ${{ steps.app-version.outputs.name }}
          APP_VERSION: ${{ steps.app-version.outputs.version }}
          APP_SLUG: ${{ steps.app-version.outputs.slug }}
          GH-REF: ${{ github.ref_name }}
        run: |
          gh release create "${APP_NAME}-${{github.ref_name}}-v${APP_VERSION}-${{github.run_number}}" \
            "${APP_SLUG}-${APP_VERSION}-${GH-REF}-debug.apk" \
            "${APP_SLUG}-${APP_VERSION}-${GH-REF}-preview.apk" \
            --title "${APP_NAME}-${GH-REF}-v${APP_VERSION}" \
            --notes "Commit: ${{ github.sha }}" \
            --latest=false
