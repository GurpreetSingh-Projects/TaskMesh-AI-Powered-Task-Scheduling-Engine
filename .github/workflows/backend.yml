name: Taskmesh Backend Deploy
on:
  push:
    branches: [dev]
    paths:
      - "backend/**"
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check secrets (temporary)
        env:
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          AUDIENCE: ${{ secrets.AUDIENCE }}
        run: |
          for v in OAUTH_CLIENT_ID AUDIENCE; do
            eval "val=\$$v"
            [ -n "$val" ] && echo "$v len=${#val}" || echo "$v EMPTY"
          done

      - name: Setup TailScale Access
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{secrets.OAUTH_CLIENT_ID}}
          audience: ${{secrets.AUDIENCE}}
          tags: tag:taskmesh-cli

      - name: Deploy to VM
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}
          TARGET: ${{ secrets.SSH_USER }}@${{ secrets.HOST }}
        run: |
          echo "${SSH_KEY}" > key
          chmod 600 key

          echo "${KNOWN_HOSTS}" > known_hosts

          ssh -i key -o UserKnownHostsFile=known_hosts -o StrictHostKeyChecking=yes "$TARGET" 'bash -s' << 'EOF'
            set -e
            cd ..
            cd apps/taskmesh/taskmesh-backend
            git pull --ff-only
            cp ../.env/.dev.env backend/
            docker compose up -d --build
          EOF
