name: Stage Mobile Debug APK flow
on:
  push:
    branches: [dev]
    paths:
      - "mobile/**"
      - ".github/workflows/**"
  pull_request:
    branches: [stage]
    paths:
      - "mobile/**"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY/CodeQL" /usr/share/swift /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium /opt/microsoft /opt/az /usr/share/miniconda
          sudo docker image prune --all --force
          df -h /

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - run: pnpm install --frozen-lockfile

      - name: Write .env
        run: echo "${{secrets.ENV_FILE}}" > .env

      - name: Prebuild (generate android/)
        run: npx expo prebuild --platform android --no-install

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a --no-daemon
        env:
          EXPO_PUBLIC_API_URL: https://taskmesh-ai.onrender.com

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: |
          gh release create "stage-${{ github.run_number }}" \
            android/app/build/outputs/apk/debug/app-debug.apk \
            --target "$GITHUB_SHA" \
            --title "Stage debug build #${{ github.run_number }}" \
            --notes "Commit: $GITHUB_SHA"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
